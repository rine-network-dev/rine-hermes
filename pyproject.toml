[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-rine"
version = "0.8.1"
description = "Official Hermes Agent plugin for the Rine network — 26 rine_* tools (incl. x402 pay/fulfill), an inbound wake channel, and a bundled skill for E2E-encrypted agent-to-agent messaging, groups, and payments"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11,<3.14"
authors = [{ name = "mmmbs", email = "mmmbs@proton.me" }]
keywords = ["rine", "hermes", "hermes-agent", "agents", "tools", "e2ee", "messaging", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    # The rine SDK owns all crypto/HTTP/config resolution; never vendored. Dev/CI
    # inject the editable local ./rine-sdk over this floor (compose.hermes.yml).
    # hermes-agent is NOT a runtime dependency: the rig supplies it on PYTHONPATH;
    # `import hermes_rine` and `python -m hermes_rine.onboard` work without it.
    # Floor is 0.13.0, and it is not documentation-grade — it is a hard runtime
    # requirement on two counts. (1) Import: this plugin imports names the SDK first
    # exported in 0.11.0 (`single_actor_value`, `may_vote`, `vote_eligibility_reason`,
    # `describe_mls_admission`, `mls_admission_skip_sentence` among others), so against
    # 0.10.0 `import hermes_rine` raises ImportError at module scope — it does not fail
    # a call, it fails to load. (2) Behaviour: the set-aside retry (`_setaside`,
    # `rine_retry_unreadable`) re-reads a parked message with `read(..., peek=True)`,
    # which 0.13.0 is the first SDK to accept. Against an older SDK that keyword is a
    # TypeError inside the sweep; worse, an SDK that silently dropped it would have every
    # retry CONSUME the message it is trying to recover. Lower this floor and the feature
    # inverts.
    #
    # 0.11.0 also inherits 0.10.0's reason for existing: it is at or above the first
    # rine whose send path fetches the recipient's signing key fresh instead of reading
    # a cached copy, so a peer that rotates its key is sent to under the new key on the
    # very next message rather than up to ten minutes later. A seal is one-shot and
    # reports nothing back, so a message sealed to a stale key is simply unreadable for
    # its recipient — nothing in this plugin can detect or retry that. Signing
    # (rine_pay) needs the SDK's `payments` extra (eth-account) — the rig installs
    # `rine[payments]`; a real install that pays must too.
    "rine>=0.13.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://rine.network"
Documentation = "https://docs.rine.network"
Repository = "https://codeberg.org/rine/rine-hermes"
Issues = "https://codeberg.org/rine/rine-hermes/issues"

[project.entry-points."hermes_agent.plugins"]
# Value is the MODULE (not module:attr). Hermes' loader (_load_entrypoint_module) does
# ep.load() then getattr(module, "register"): a "hermes_rine:register" value loads the
# FUNCTION, then looks for `.register` on it → "no register() function". The Hermes docs
# example is `my-plugin = "my_plugin_package"` — point at the package.
rine = "hermes_rine"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    # The enable helper round-trips config.yaml; in the Hermes venv ruamel/pyyaml are
    # always present (Hermes deps), but the standalone test env needs a YAML parser.
    "pyyaml>=6.0",
    # x402 payer signing: `rine_pay` / gateway auto-pay exercise the real EIP-3009 sign
    # path, so the dev/rig env always carries the SDK's (otherwise optional) `payments`
    # extra. Listed DIRECTLY, not via `rine[payments]`, because the rig installs the local
    # SDK with a bare `-e /work/rine-sdk` — uv drops editability when a path carries an
    # extra, so the extra cannot ride on the SDK path. Mirrors langchain-rine's dev extra.
    "eth-account>=0.13.0,<0.14",
]

[tool.hatch.build.targets.sdist]
# .gitignore does NOT govern sdist contents — this list does. `.e2e.env` (live
# rig credentials) shipped in every sdist through 0.3.0 because it was only
# gitignored. Keep the env patterns; scripts/scan-artifact-secrets.py is the
# backstop that fails the publish if anything credential-shaped slips back in.
# `.uv-cache/`/`.venv/` are transient uv build artifacts that carry binaries
# (e.g. ruff) whose bytes trip the credential scanner — never ship them.
# `uv.lock` is excluded because a lock is only ever as fresh as its last re-lock
# against a published registry, while the sdist's own METADATA carries the real
# floor. Shipping one lets `uv sync` install an older `rine` than the plugin
# imports — and `uv lock --check` reports that lock as current, so nothing warns.
exclude = [
    "phases/",
    "e2e/",
    "tests/",
    ".e2e.env",
    "*.env",
    ".uv-cache/",
    ".venv/",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_rine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "TCH",
    "D101", "D102", "D103", "D107", "D205", "D400",
]
ignore = ["D100"]

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting `test_<what>_<when>_<expected>`; per-symbol
# docstrings would be noise.
"tests/**" = ["D101", "D102", "D103", "D107"]
# The live E2E driver is a script (excluded from the sdist), not library code.
"e2e/**" = ["D101", "D102", "D103", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["hermes_rine"]
mypy_path = "src"

# Hermes internals (``tools.registry``, ``gateway.*``) are NOT a typed runtime
# dependency — they are only present on PYTHONPATH inside a live Hermes process /
# the Docker rig. At our boundary their values are legitimately ``Any`` (and the base
# adapter is ``Any`` when Hermes is absent). Relaxing return-Any/subclass strictness on
# exactly the boundary modules keeps the gate green WITH or WITHOUT hermes-agent
# installed, without weakening checks on our own typed code (_journal/_format/_client/
# _gate/_schemas). ``disable_error_code`` (not per-line ignores) avoids the
# ``warn_unused_ignores`` trap when Hermes IS present.
[[tool.mypy.overrides]]
module = [
    "hermes_rine.adapter",
    "hermes_rine._outbound",
    "hermes_rine._poll",
    "hermes_rine._sse",
    "hermes_rine._sweep",
    "hermes_rine.tools.messaging",
    "hermes_rine.tools.discovery",
    "hermes_rine.tools.groups",
    "hermes_rine.tools.groups_admin",
    "hermes_rine.tools.groups_list",
    "hermes_rine.tools.groups_reclaim",
    "hermes_rine.tools.payments",
    "hermes_rine.tools.unreadable",
]
warn_return_any = false
disable_error_code = ["no-any-return", "misc"]

# ``enable`` dynamically imports an optional YAML lib (ruamel/pyyaml) + ``hermes_cli`` —
# all absent / unstubbed off the Hermes venv, so their values are legitimately ``Any``
# and the import errors are environment-dependent. Disable just the import-resolution
# codes here (per-line ignores would be ``unused`` in the rig where the libs ARE present).
[[tool.mypy.overrides]]
module = ["hermes_rine.enable", "hermes_rine.doctor"]
disable_error_code = ["import-untyped", "import-not-found"]
